# GitHub Actions - 世界杯热身赛数据自动采集
# 每6小时自动运行一次

name: Football Data Collection

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Run collection
        env:
          FD_API_KEY: ${{ secrets.FD_API_KEY }}
        run: python scripts/github_collect.py
      
      - name: Commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git config --local credential.helper store
          echo "https://github.com:${{ secrets.GITHUB_TOKEN }}@github.com" > ~/.git-credentials
          git add cache/
          git diff --cached --quiet || git commit -m "Data update: $(date +'%Y-%m-%d %H:%M')"
          git push
