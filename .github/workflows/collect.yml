# GitHub Actions - 世界杯热身赛数据自动采集
# 每6小时自动运行一次

name: Football Data Collection

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Collect warmup matches
        env:
          FD_API_KEY: ${{ secrets.FD_API_KEY }}
        run: python scripts/show_matches.py
      
      - name: Collect odds data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/get_wc_odds.py
      
      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: 'cache/*.json'
          commit_message: "Data update: $(date +'%Y-%m-%d %H:%M')"
